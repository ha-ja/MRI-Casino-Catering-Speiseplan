name: Speiseplan

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

jobs:
  speiseplan:
    name: Speiseplan abrufen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Speiseplan ausgeben
        run: bash bin/speiseplan.sh today
